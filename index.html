<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CharlestonHacks — Community for Builders</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --cyan:#00e0ff;
  --bg:#000;
  --text:#fff;
  --muted:rgba(255,255,255,0.5);
}

body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:'Orbitron',sans-serif;
}

/* NAV */
.top-nav {
  display:flex;
  justify-content:space-between;
  padding:16px 20px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.nav-links a {
  margin-left:16px;
  color:var(--muted);
  text-decoration:none;
}

.nav-links a:hover { color:var(--cyan); }

/* HERO */
.hero {
  min-height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 20px;
}

.hero-inner {
  max-width:600px;
}

.hero-title {
  font-size:2.5rem;
  margin-top:10px;
}

.hero-sub {
  margin-top:10px;
  color:var(--muted);
}

.btn {
  margin-top:20px;
  display:inline-block;
  padding:12px 24px;
  background:var(--cyan);
  color:#000;
  text-decoration:none;
  font-weight:bold;
}

/* EVENTS */
.events-list {
  max-width:600px;
  margin:40px auto;
}

.event-card {
  padding:16px;
  border:1px solid rgba(255,255,255,0.1);
  margin-bottom:12px;
}

</style>
</head>

<body>

<nav class="top-nav">
  <div>CharlestonHacks</div>
  <div class="nav-links">
    <a href="#events">Events</a>
    <a href="subscribe.html">Join</a>
  </div>
</nav>

<section class="hero" id="events">
  <div class="hero-inner">
    <p>Next Event</p>

    <h1 id="event-title" class="hero-title">Loading…</h1>
    <p id="event-date" class="hero-sub"></p>

    <a id="event-link" class="btn" href="#" target="_blank">RSVP</a>
  </div>
</section>

<div id="events-more" class="events-list"></div>

<script>
const FEED_URL = "https://charlestonhacks-events.dmhamilton1.workers.dev";

async function loadEvents() {
  try {
    const res = await fetch(FEED_URL);
    const data = await res.json();

    const now = Date.now();

    const upcoming = data
      .filter(e => new Date(e.startDate).getTime() > now)
      .sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));

    if (!upcoming.length) {
      document.getElementById("event-title").innerText = "New event dropping soon";
      return;
    }

    const next = upcoming[0];

    document.getElementById("event-title").innerText = next.title;
    document.getElementById("event-date").innerText =
      new Date(next.startDate).toLocaleDateString();

    document.getElementById("event-link").href = next.link;

    // more events
    const more = upcoming.slice(1,3);

    document.getElementById("events-more").innerHTML =
      more.map(e => `
        <div class="event-card">
          <strong>${e.title}</strong><br>
          ${new Date(e.startDate).toLocaleDateString()}<br>
          <a href="${e.link}" target="_blank">View →</a>
        </div>
      `).join("");

  } catch(e) {
    document.getElementById("event-title").innerText = "Unable to load events";
  }
}

loadEvents();
</script>

</body>
</html>
