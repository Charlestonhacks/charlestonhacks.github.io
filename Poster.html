  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100vh;
      background-color: #181818;
      font-family: Arial, sans-serif;
      color: #fff;
      overflow-x: hidden;
    }

    /* Header */
    .events-header-img {
      display: block;
      margin: 20px auto 10px;
      width: 400px;
      height: auto;
      cursor: pointer;
      transition: transform 0.3s ease, filter 0.3s ease;
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.3));
    }
    .events-header-img:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 12px rgba(255, 100, 100, 0.6));
    }

    /* Title */
    h1.page-title {
      text-align: center;
      font-size: 2.5rem;
      margin-top: 10px;
      margin-bottom: 20px;
      color: #fff;
      cursor: pointer;
      transition: color 0.3s ease, transform 0.3s ease;
    }
    h1.page-title:hover { color: #ff5555; transform: scale(1.05); }

    @media (max-width: 800px) { 
      .events-header-img { width: 300px; } 
      h1.page-title { font-size: 2rem; } 
    }
    @media (max-width: 650px) { 
      .events-header-img { width: 250px; } 
      h1.page-title { font-size: 1.8rem; } 
    }
    @media (max-width: 480px) { 
      .events-header-img { width: 200px; } 
      h1.page-title { font-size: 1.6rem; } 
    }

    /* Gallery */
    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      justify-items: center;
    }

    .gallery-item {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      position: relative;
      width: 100%;
      max-width: 300px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-item:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 0 25px rgba(255, 80, 80, 0.7);
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    .poster-event-date {
      display: block;
      flex: none;
      width: 100%;
      padding: 8px 10px;
      border-top: 1px solid rgba(201,163,94,0.72);
      background: linear-gradient(90deg, rgba(24,24,24,0.98), rgba(35,35,35,0.98));
      color: #ffe4a3;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.2;
      text-align: center;
    }

    .poster-order-toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 20px 12px;
      text-align: center;
    }
    .poster-order-toolbar button {
      border: 1px solid rgba(201,163,94,0.75);
      border-radius: 8px;
      padding: 9px 14px;
      color: #ffe4a3;
      background: rgba(201,163,94,0.12);
      font: inherit;
      cursor: pointer;
    }
    .poster-order-toolbar button:hover,
    .poster-order-toolbar button:focus-visible {
      background: rgba(201,163,94,0.25);
      outline: 2px solid #c9a35e;
      outline-offset: 2px;
    }
    #poster-order-reset[hidden],
    #poster-order-status[hidden] { display: none !important; }
    #poster-order-status {
      flex-basis: 100%;
      margin: 0;
      color: rgba(255,255,255,0.75);
      font-size: 0.9rem;
    }

    .poster-order-actions {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 2;
      display: none;
      justify-content: space-between;
      pointer-events: none;
    }
    body.poster-reordering .poster-order-actions { display: flex; }
    .poster-order-actions button {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(201,163,94,0.9);
      border-radius: 50%;
      color: #ffe4a3;
      background: rgba(0,0,0,0.88);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
    }
    .poster-order-actions button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .poster-order-actions button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    body.poster-reordering .gallery-item { cursor: default; }

    /* External link overlay */
    .external-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 1.2rem;
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateY(-5px);
      text-shadow: 0 0 8px rgba(255, 100, 100, 0.8);
      pointer-events: none;
    }

    .gallery-item.external:hover .external-icon {
      opacity: 1;
      transform: translateY(0);
    }

    /* Footer */
    footer {
      background-color: transparent;
      text-align: center;
      padding: 32px 20px 64px;
      margin-top: 40px;
      position: relative;
    }

    .footer-back-button {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 32px;
    }

    .footer-back-button img {
      max-width: 240px;
      width: 60vw;
      height: auto;
      transition: transform 0.3s ease;
    }

    .footer-back-button img:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 8px rgba(255, 80, 80, 0.6));
    }

    @media (max-width: 900px) {
      .gallery { grid-template-columns: 1fr 1fr; }
      .gallery-item { max-width: 95vw; }
    }

    @media (max-width: 768px) {
      .gallery { grid-template-columns: 1fr; }
    }

    @media (max-width: 500px) {
      .footer-back-button img { max-width: 92vw; }
    }

  <script>
    (() => {
      const gallery = document.getElementById("gallery");
      const toggle = document.getElementById("poster-reorder-toggle");
      const reset = document.getElementById("poster-order-reset");
      const status = document.getElementById("poster-order-status");
      if (!gallery || !toggle || !reset || !status) return;

      const STORAGE_KEY = "charlestonhacks:poster-gallery-order:v3";
      const posters = Array.from(gallery.querySelectorAll(".gallery-item"));
      const posterId = (poster) => {
        if (poster.dataset.posterId) return poster.dataset.posterId;
        const image = poster.querySelector("img");
        poster.dataset.posterId = (poster.getAttribute("href") || "") + "|" + (image?.getAttribute("src") || "");
        return poster.dataset.posterId;
      };
      const initialOrder = posters.map(posterId);
      let reordering = false;

      function saveOrder() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(gallery.children).map(posterId)));
        } catch {}
      }

      function applyOrder(ids) {
        const byId = new Map(Array.from(gallery.children).map((poster) => [posterId(poster), poster]));
        ids.forEach((id) => {
          const poster = byId.get(id);
          if (poster) gallery.append(poster);
        });
        byId.forEach((poster, id) => {
          if (!ids.includes(id)) gallery.append(poster);
        });
        syncControls();
      }

      function syncControls() {
        const items = Array.from(gallery.querySelectorAll(".gallery-item"));
        items.forEach((poster, index) => {
          const eventDate = poster.dataset.eventDate;
          if (eventDate && !poster.querySelector(".poster-event-date")) {
            const [year, month, day] = eventDate.split("-");
            const dateLabel = day ? `${month}/${day}/${year}` : `${month}/${year}`;
            const date = document.createElement("time");
            date.className = "poster-event-date";
            date.dateTime = eventDate;
            date.textContent = dateLabel;
            poster.append(date);
          }

          let actions = poster.querySelector(".poster-order-actions");
          if (!actions) {
            actions = document.createElement("div");
            actions.className = "poster-order-actions";
            actions.setAttribute("aria-label", "Change poster position");

            const up = document.createElement("button");
            up.type = "button";
            up.textContent = "↑";
            up.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              movePoster(poster, -1);
            });

            const down = document.createElement("button");
            down.type = "button";
            down.textContent = "↓";
            down.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              movePoster(poster, 1);
            });

            actions.append(up, down);
            poster.append(actions);
          }
          const image = poster.querySelector("img");
          const label = image?.alt || "Poster";
          const buttons = actions.querySelectorAll("button");
          buttons[0].setAttribute("aria-label", "Move " + label + " earlier");
          buttons[0].title = "Move earlier";
          buttons[0].disabled = index === 0;
          buttons[1].setAttribute("aria-label", "Move " + label + " later");
          buttons[1].title = "Move later";
          buttons[1].disabled = index === items.length - 1;
          poster.setAttribute("aria-posinset", String(index + 1));
          poster.setAttribute("aria-setsize", String(items.length));
        });
      }

      function movePoster(poster, direction) {
        const neighbor = direction < 0 ? poster.previousElementSibling : poster.nextElementSibling;
        if (!neighbor) return;
        if (direction < 0) gallery.insertBefore(poster, neighbor);
        else gallery.insertBefore(poster, neighbor.nextElementSibling);
        saveOrder();
        syncControls();
        const index = Array.from(gallery.children).indexOf(poster) + 1;
        status.textContent = "Moved " + (poster.querySelector("img")?.alt || "poster") + " to position " + index + " of " + gallery.children.length + ".";
      }

      posters.forEach((poster) => {
        poster.addEventListener("click", (event) => {
          if (reordering && !event.target.closest(".poster-order-actions")) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
      });

      toggle.addEventListener("click", () => {
        reordering = !reordering;
        document.body.classList.toggle("poster-reordering", reordering);
        toggle.setAttribute("aria-pressed", String(reordering));
        toggle.textContent = reordering ? "Done reordering" : "Reorder posters";
        reset.hidden = !reordering;
        status.hidden = !reordering;
        status.textContent = reordering
          ? "Use the arrows on a poster to move it. Your order saves in this browser."
          : "Poster order saved in this browser.";
      });

      reset.addEventListener("click", () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch {}
        applyOrder(initialOrder);
        status.textContent = "Newest-first date order restored.";
      });

      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (Array.isArray(saved)) applyOrder(saved);
      } catch {}

      const meetupPoster = gallery.querySelector("img[data-poster-base64]");
      if (meetupPoster) {
        fetch(meetupPoster.dataset.posterBase64, { cache: "force-cache" })
          .then((response) => {
            if (!response.ok) throw new Error("Poster image unavailable");
            return response.text();
          })
          .then((encoded) => {
            const binary = atob(encoded.trim());
            const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
            meetupPoster.src = URL.createObjectURL(new Blob([bytes], { type: "image/webp" }));
          })
          .catch(() => {
            meetupPoster.alt = "CharlestonHacks Show & Tell at Freehouse Brewery, November 17, 2026";
          });
      }
      syncControls();
    })();
  </script>
