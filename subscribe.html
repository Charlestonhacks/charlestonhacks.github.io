<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Subscribe to Charleston Hacks Mailing List to stay updated on the latest events and news.">
    <title>Subscribe to Mailing List</title>
    <link href="//cdn-images.mailchimp.com/embedcode/classic-061523.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #0a0a0a;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #e0e0e0;
        }

        .top-nav {
            display: flex;
            align-items: center;
            padding: 0 24px;
            height: 58px;
            border-bottom: 1px solid rgba(0,224,255,0.1);
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(10px);
            z-index: 100;
            gap: 8px;
        }
        .nav-logo img { width: 140px; height: auto; display: block; filter: brightness(1.12); }
        .nav-links { display: flex; align-items: center; gap: 6px; margin-left: auto; }
        .nav-links a {
            color: rgba(255,255,255,0.62);
            text-decoration: none;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            padding: 7px 10px;
            border-radius: 7px;
            transition: color 0.2s, background 0.2s;
        }
        .nav-links a:hover { color: #00e0ff; background: rgba(0,224,255,0.06); }
        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: rgba(255,255,255,0.72);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 6px;
            margin-left: auto;
        }
        @media (max-width: 768px) {
            .top-nav { padding: 0 16px; height: 54px; }
            .nav-links { display: none; }
            .nav-links.open {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 54px; left: 0; right: 0;
                background: rgba(0,0,0,0.97);
                border-bottom: 1px solid rgba(0,224,255,0.1);
                padding: 12px 16px;
                gap: 4px;
                backdrop-filter: blur(12px);
            }
            .nav-links.open a { padding: 10px 12px; font-size: 0.82rem; }
            .nav-toggle { display: block; }
        }

        #mc_embed_shell {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 58px);
            padding: 20px;
        }

        #mc_embed_signup {
            background: #121212;
            border: 1px solid #2a2a2a;
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        h2 {
            color: #c9a35e;
            text-align: center;
            margin-bottom: 1rem;
        }

        .indicates-required {
            text-align: center;
            margin-bottom: 20px;
            color: #888;
            font-size: .9rem;
        }

        .asterisk { color: #00e0ff; }

        .mc-field-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: .9rem;
        }

        input[type="email"],
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 4px;
            color: #e0e0e0;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input[type="email"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #00e0ff;
        }

        input[type="submit"] {
            background-color: #c9a35e;
            color: #000;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: .05em;
            transition: background-color .2s;
        }

        input[type="submit"]:hover {
            background-color: #e0b96e;
        }

        .captcha-group {
            margin-bottom: 20px;
            padding: 14px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
        }

        .captcha-group label {
            color: #aaa;
            font-size: .9rem;
            margin-bottom: 8px;
            display: block;
        }

        .captcha-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .captcha-question {
            color: #00e0ff;
            font-size: 1.05rem;
            font-weight: bold;
            white-space: nowrap;
        }

        #captcha-answer {
            width: 80px;
            padding: 8px 10px;
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 1rem;
            text-align: center;
        }

        #captcha-answer:focus {
            outline: none;
            border-color: #00e0ff;
        }

        #captcha-error {
            color: #ff6b6b;
            font-size: .82rem;
            margin-top: 6px;
            display: none;
        }

        .response {
            display: none;
            margin-top: 20px;
        }

        .home-icon { display: none; }

        @media (max-width: 600px) {
            #mc_embed_signup {
                padding: 1.25rem;
            }
        }

        #subscribe-success {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 40px 20px;
            text-align: center;
        }
        #subscribe-success .success-icon {
            font-size: 3rem;
            color: #00e0ff;
        }
        #subscribe-success h3 {
            color: #c9a35e;
            font-size: 1.4rem;
            margin: 0;
        }
        #subscribe-success p {
            color: #aaa;
            font-size: .9rem;
            line-height: 1.6;
            margin: 0;
        }
        #subscribe-success a {
            display: inline-block;
            margin-top: 8px;
            color: #00e0ff;
            font-size: .85rem;
            text-decoration: none;
        }
        #subscribe-success a:hover { text-decoration: underline; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Math captcha setup
            const a = Math.floor(Math.random() * 9) + 1;
            const b = Math.floor(Math.random() * 9) + 1;
            const answer = a + b;
            document.getElementById('captcha-question').textContent = `${a} + ${b} = ?`;

            const form = document.getElementById('mc-embedded-subscribe-form');
            const captchaInput = document.getElementById('captcha-answer');
            const captchaError = document.getElementById('captcha-error');

            form.addEventListener('submit', function(event) {
                const emailInput = document.getElementById('mce-EMAIL');
                if (!validateEmail(emailInput.value)) {
                    event.preventDefault();
                    alert('Please enter a valid email address.');
                    return;
                }
                if (parseInt(captchaInput.value, 10) !== answer) {
                    event.preventDefault();
                    captchaError.style.display = 'block';
                    captchaInput.focus();
                    return;
                }
                captchaError.style.display = 'none';
                // Show success panel immediately — Mailchimp confirmation opens in new tab
                setTimeout(function() {
                    document.getElementById('mc_embed_signup_scroll').style.display = 'none';
                    document.getElementById('subscribe-success').style.display = 'flex';
                }, 100);
            });

            captchaInput.addEventListener('input', function() {
                captchaError.style.display = 'none';
            });

            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }

            const homeIcon = document.querySelector('.home-icon');
            homeIcon.addEventListener('click', function() {
                window.location.href = 'index.html';
            });
        });
    </script>
  <link rel="canonical" href="https://charlestonhacks.com/subscribe.html"/>

  <link rel="apple-touch-icon" href="images/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest.json"/>
</head>

    <div id="mc_embed_shell">
        <div id="mc_embed_signup">
            <form action="https://charlestonhacks.us12.list-manage.com/subscribe/post?u=79363b7a43970f760d61360fd&amp;id=3b95e0177a&amp;f_id=002f09e9f0" 
                  method="post" 
                  id="mc-embedded-subscribe-form" 
                  name="mc-embedded-subscribe-form" 
                  class="validate" 
                  target="_blank">
                <div id="mc_embed_signup_scroll">
                    <h2>Subscribe to Our Mailing List</h2>
                    <div class="indicates-required">
                        <span class="asterisk">*</span> indicates required
                    </div>
                    <div class="mc-field-group">
                        <label for="mce-EMAIL">Email Address <span class="asterisk">*</span></label>
                        <input type="email" name="EMAIL" class="required email" id="mce-EMAIL" required>
                    </div>
                    <div class="mc-field-group">
                        <label for="mce-FNAME">First Name</label>
                        <input type="text" name="FNAME" class="" id="mce-FNAME">
                    </div>
                    <div class="mc-field-group">
                        <label for="mce-LNAME">Last Name</label>
                        <input type="text" name="LNAME" class="" id="mce-LNAME">
                    </div>
                    <div id="mce-responses" class="clear">
                        <div class="response" id="mce-error-response"></div>
                        <div class="response" id="mce-success-response"></div>
                    </div>
                    <!-- real people should not fill this in and expect good things - do not remove this or risk form bot signups-->
                    <div style="position: absolute; left: -5000px;" aria-hidden="true">
                        <input type="text" name="b_79363b7a43970f760d61360fd_3b95e0177a" tabindex="-1" value="">
                    </div>
                    <div class="captcha-group">
                        <label for="captcha-answer">Quick check — prove you're human</label>
                        <div class="captcha-row">
                            <span class="captcha-question" id="captcha-question" aria-live="polite"></span>
                            <input type="number" id="captcha-answer" autocomplete="off"
                                   placeholder="?" aria-label="Captcha answer" min="0" max="99">
                        </div>
                        <div id="captcha-error" role="alert">Incorrect answer — please try again.</div>
                    </div>
                    <div class="clear">
                        <input type="submit" value="Subscribe" name="subscribe" id="mc-embedded-subscribe" class="button">
                    </div>
                </div>
            </form>
        <div id="subscribe-success">
            <i class="fas fa-check-circle success-icon"></i>
            <h3>You're in!</h3>
            <p>Thanks for subscribing. Check your inbox for a confirmation email — then you're all set for event updates and community news.</p>
            <a href="community.html"><i class="fas fa-arrow-left" style="margin-right:6px;"></i>Back to Community</a>
        </div>
        </div>
    </div>
  <script>
    (function () {
      const toggle = document.querySelector('.nav-toggle');
      const links = document.querySelector('.nav-links');
      if (!toggle || !links) return;
      toggle.addEventListener('click', function () {
        const open = links.classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(open));
        toggle.querySelector('i').className = open ? 'fas fa-times' : 'fas fa-bars';
      });
      links.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () {
          links.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
          toggle.querySelector('i').className = 'fas fa-bars';
        });
      });
    })();
  </script>
