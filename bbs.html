<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBS — CharlestonHacks</title>
  <script>if (window.self !== window.top) document.documentElement.classList.add("is-embedded");</script>
  <meta name="description" content="CharlestonHacks Community BBS — real-time chat and Zork for Charleston's builders, hackers, and makers.">
  <link rel="canonical" href="https://charlestonhacks.com/bbs.html">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6NDKG07DY6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-6NDKG07DY6");
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan: #00e0ff;
      --border: rgba(0,224,255,0.1);
      --transition: 0.2s ease;
    }

    html, body {
      height: 100%;
      background: #000;
      color: #0f0;
      font-family: monospace;
    }

    /* ===== Focused BBS Navigation ===== */
    .top-nav {
      display: flex;
      align-items: center;
      padding: 0 24px;
      height: 58px;
      border-bottom: 1px solid rgba(0,224,255,0.1);
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(10px);
      z-index: 100;
      gap: 8px;
    }

    .nav-logo img {
      width: 140px;
      height: auto;
      display: block;
      filter: brightness(1.12);
    }

    @media (max-width: 768px) {
      .top-nav { padding: 0 16px; height: 54px; }
      .nav-logo img { width: 140px; }
    }

    /* ===== BBS Content ===== */
    #bbs-modal {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      min-width: 0;
      overflow-x: hidden;
      padding: 24px 16px 40px;
      min-height: calc(100vh - 58px);
    }

    #bbs-modal #bbs-wrapper {
      width: min(100%, 760px) !important;
      max-width: 100%;
      min-width: 0 !important;
      max-height: none !important;
    }

    #bbs-modal #bbs-screen {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: min(480px, 55vh) !important;
      overflow-x: hidden;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #bbs-modal #bbs-close {
      display: none !important;
    }

    .bbs-hint {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px 20px 8px;
      color: #9cff9c;
      text-align: center;
      font-size: clamp(0.82rem, 1.8vw, 0.95rem);
      line-height: 1.6;
      letter-spacing: 0.02em;
    }
    .bbs-hint strong, .bbs-hint code { color: #caffca; }
    #bbs-auth [data-bbs-sign-out] {
      margin-left: 0.5rem;
      padding: 3px 8px;
      border: 1px solid rgba(240,198,106,0.55);
      border-radius: 5px;
      color: #ffe4a3;
      background: rgba(240,198,106,0.06);
      font: inherit;
      font-size: 0.78em;
      cursor: pointer;
    }
    #bbs-auth [data-bbs-sign-out]:hover,
    #bbs-auth [data-bbs-sign-out]:focus-visible {
      background: rgba(240,198,106,0.16);
      outline: 2px solid #f0c66a;
      outline-offset: 2px;
    }
    #bbs-auth [data-bbs-sign-out]:disabled { opacity: 0.6; cursor: wait; }
    html.is-embedded #bbs-auth [data-bbs-sign-out] { display: none !important; }

    html.is-embedded .top-nav { display: none !important; }
    html.is-embedded #bbs-modal {
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: 16px;
    }
  </style>
</head>
<body>

  <nav class="top-nav" role="navigation" aria-label="Main navigation">
    <a href="/" class="nav-logo" aria-label="CharlestonHacks home">
      <img src="images/charlestonhackslogo.svg" alt="CharlestonHacks">
    </a>
  </nav>

  <p class="bbs-hint" id="bbs-intro">
    <strong>Public community chat.</strong> Messages are visible to everyone who visits and saved in the shared history.
    Sign in with your CharlestonHacks member account to post. Please don’t share private information.
    Type <code>zork</code> to play; type <code>/exit</code> to return to chat.
  </p>

  <!-- BBS mounts here -->
  <div id="bbs-modal"></div>


  <script type="module">
    import { initBBS } from "/assets/js/bbs.js?v=accurate-chat-presence-20261029";
    document.addEventListener("DOMContentLoaded", initBBS);
  </script>

</body>
</html>
