name: Site PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Event tests, media inventory, and asset paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch PR base for regression comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Event tests
        run: node tests/homepage-events.test.mjs
      - name: Checker tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Media inventory
        run: python3 scripts/check_media_manifest.py
      - name: New broken local asset paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_local_assets.py --base-ref "$BASE_SHA"
